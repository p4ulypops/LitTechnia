name: Deploy LitTechnia to VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - main

concurrency:
  group: littechnia-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    # Pushes to `develop` always deploy to dev automatically.
    # Deploys to production (`main`) only happen via manual workflow_dispatch,
    # gated by the `production` GitHub Environment's required reviewers.
    environment: ${{ (github.event.inputs.environment == 'main') && 'production' || 'development' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_PATH: ${{ (github.event.inputs.environment == 'main') && secrets.VPS_APP_PATH_MAIN || secrets.VPS_APP_PATH_DEV }}
      VPS_SERVICE: ${{ github.event.inputs.environment == 'main' && 'littechnia-main' || 'littechnia-dev' }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production artefact
        run: npm run build

      - name: Configure verified SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_APP_PATH"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync release to the VPS
        run: |
          set -eu
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'data.db' \
            --exclude 'data' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/"

      - name: Install production dependencies and restart
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "set -eu; cd '$VPS_APP_PATH'; npm ci --omit=dev; sudo systemctl restart $VPS_SERVICE; sudo systemctl is-active --quiet $VPS_SERVICE"
