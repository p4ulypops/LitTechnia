name: Deploy LitTechnia to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wordsmithery-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production artefact
        run: npm run build

      - name: Configure verified SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_APP_PATH"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync release to the VPS
        run: |
          set -eu
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'data.db' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/"

      - name: Install production dependencies and restart
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "set -eu; cd '$VPS_APP_PATH'; npm ci --omit=dev; sudo systemctl restart wordsmithery; sudo systemctl is-active --quiet wordsmithery"
